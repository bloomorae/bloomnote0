
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose your flowers | Bloomnote</title>
    <link rel="stylesheet" href="collection.css">

    <style>
        .creator-footer {
            text-align: center;
            padding: 28px 15px;
            border-top: 1px solid #eadbd4;
            font-family: Georgia, 'Times New Roman', serif;
            color: #9b756b;
            font-size: 14px;
            line-height: 1.35;
        }

        .creator-footer p {
            margin: 2px 0;
        }
    </style>
</head>
<body>

    <header class="topbar">
        <a href="index.html" class="logo">bloomnote<span>✿</span></a>
        <a href="index.html" class="back-link">← Home</a>
    </header>

    <main>
        <section class="intro">
            <p class="eyebrow">A GARDEN FULL OF FEELINGS</p>
            <h1>Pick your <em>flowers.</em></h1>
            <p>Choose every little bloom you'd like to send.</p>
        </section>

        <section class="collection">
            <div class="section-heading">
                <h2>Flower collection</h2>
                <span id="flower-count">20 flowers</span>
            </div>

            <div class="categories" id="categories"></div>

            <div class="flower-grid" id="flower-grid"></div>
        </section>
    </main>

    <footer class="creator-footer">
        <p>Made with a little love by bloomnote ♡</p>
        <p>Created by Pari ♡</p>
        <p>© 2026 Bloomnote</p>
    </footer>

    <footer class="selection-bar">
        <div>
            <p class="selection-label">YOUR FLOWER SELECTION</p>
            <p class="selection-total">
                <span id="total-count">0</span> flowers selected
            </p>
        </div>

        <button id="continue-button" disabled>
            Continue →
        </button>
    </footer>

    <script src="collection.js"></script>
</body>
</html>
